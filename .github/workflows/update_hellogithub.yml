name: Update HelloGitHub Popular Repos

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0 点更新
  workflow_dispatch:      # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 更新 HelloGitHub 热门仓库
        run: python update_hellogithub_repos.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "自动更新 HelloGitHub 热门仓库"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
